name: Reuz Android APK

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', 'src/page.js', 'scripts/export-page.mjs', '.github/workflows/android.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'android/**', 'src/page.js', 'scripts/export-page.mjs', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bundle the page into the app
        run: node scripts/export-page.mjs

      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Restore signing key (when the repository has one)
        env:
          KEY_B64: ${{ secrets.REUZ_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/reuz.jks"
            echo "REUZ_KEYSTORE=$RUNNER_TEMP/reuz.jks" >> "$GITHUB_ENV"
          fi

      - name: Prepare signing key for Java (when needed)
        env:
          REUZ_KEYSTORE_PASSWORD: ${{ secrets.REUZ_KEYSTORE_PASSWORD }}
          REUZ_KEY_ALIAS: ${{ secrets.REUZ_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${REUZ_KEYSTORE:-}" ]]; then
            exit 0
          fi
          if keytool -list -storetype PKCS12 -keystore "$REUZ_KEYSTORE" -storepass:env REUZ_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            printf 'REUZ_KEYSTORE_PASSWORD=%s\n' "$REUZ_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            exit 0
          fi

          # Repair a pasted Unicode punctuation or surrounding whitespace only
          # when the result can actually open this same keystore.
          candidate="$(printf '%s' "$REUZ_KEYSTORE_PASSWORD" | iconv -f UTF-8 -t ASCII//TRANSLIT 2>/dev/null | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true)"
          if [[ -n "$candidate" && "$candidate" != "$REUZ_KEYSTORE_PASSWORD" ]]; then
            export REUZ_CANDIDATE_PASSWORD="$candidate"
            if keytool -list -storetype PKCS12 -keystore "$REUZ_KEYSTORE" -storepass:env REUZ_CANDIDATE_PASSWORD >/dev/null 2>&1; then
              echo "::add-mask::$candidate"
              printf 'REUZ_KEYSTORE_PASSWORD=%s\n' "$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          # Java's PKCS12 reader rejects some non-ASCII passwords. Rewrap the
          # SAME private key/certificate with a temporary ASCII CI password.
          umask 077
          pem="$(mktemp "$RUNNER_TEMP/reuz-signing.XXXXXXXX.pem")"
          trap 'shred -u "$pem" 2>/dev/null || rm -f "$pem"' EXIT
          converted="$RUNNER_TEMP/reuz-ci.p12"
          if openssl pkcs12 -in "$REUZ_KEYSTORE" -passin env:REUZ_KEYSTORE_PASSWORD -nodes -out "$pem" >/dev/null 2>&1 ||
             openssl pkcs12 -legacy -in "$REUZ_KEYSTORE" -passin env:REUZ_KEYSTORE_PASSWORD -nodes -out "$pem" >/dev/null 2>&1; then
            ci_password="$(openssl rand -hex 32)"
            echo "::add-mask::$ci_password"
            export REUZ_CI_PASSWORD="$ci_password"
            if openssl pkcs12 -export -in "$pem" -out "$converted" -name "${REUZ_KEY_ALIAS:-reuz}" -passout env:REUZ_CI_PASSWORD >/dev/null 2>&1 &&
               keytool -list -storetype PKCS12 -keystore "$converted" -storepass:env REUZ_CI_PASSWORD -alias "${REUZ_KEY_ALIAS:-reuz}" >/dev/null 2>&1; then
              printf 'REUZ_KEYSTORE=%s\nREUZ_KEYSTORE_PASSWORD=%s\n' "$converted" "$ci_password" >> "$GITHUB_ENV"
            else
              echo "::error::PKCS12 decrypted, but Java could not validate the converted store/alias."
            fi
          else
            echo "::error::Original PKCS12 cannot be decrypted using the configured secret."
          fi

      - name: Check signing password (no secret output)
        shell: bash
        run: |
          if [[ -z "${REUZ_KEYSTORE:-}" ]]; then
            exit 0
          fi
          if keytool -list -storetype PKCS12 -keystore "$REUZ_KEYSTORE" -storepass:env REUZ_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "password OK"
          else
            echo "password wrong"
            exit 1
          fi

      - name: Build release APK and Play Store bundle
        working-directory: android
        env:
          REUZ_KEY_ALIAS: ${{ secrets.REUZ_KEY_ALIAS }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Reuz-Android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: Reuz-PlayStore-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish stable download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Reuz.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Reuz.aab
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Reuz.apk Reuz.aab --target "$GITHUB_SHA" --title "Reuz (latest)" \
            --notes "Latest Reuz build from main. Reuz.apk installs on a phone; Reuz.aab is the Google Play upload bundle." --latest
