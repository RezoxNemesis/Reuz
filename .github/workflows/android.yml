name: Reuz Android APK

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Restore signing key (when the repository has one)
        env:
          KEY_B64: ${{ secrets.REUZ_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/reuz.jks"
            echo "REUZ_KEYSTORE=$RUNNER_TEMP/reuz.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          REUZ_KEYSTORE_PASSWORD: ${{ secrets.REUZ_KEYSTORE_PASSWORD }}
          REUZ_KEY_ALIAS: ${{ secrets.REUZ_KEY_ALIAS }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Reuz-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Reuz.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Reuz.apk --target "$GITHUB_SHA" --title "Reuz (latest)" \
            --notes "Latest Reuz Android build from main. Install over the previous version." --latest
