name: Reuz Android APK

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', 'src/page.js', 'scripts/export-page.mjs', '.github/workflows/android.yml', 'scripts/reuz-release-signing.sh' ]
  pull_request:
    branches: [ main ]
    paths: [ 'android/**', 'src/page.js', 'scripts/export-page.mjs', '.github/workflows/android.yml', 'scripts/reuz-release-signing.sh' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reuz-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Check history before ever initializing a replacement certificate.

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bundle the page into the app
        run: node scripts/export-page.mjs

      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Self-test permanent signing key (PR only)
        if: github.event_name == 'pull_request'
        run: bash scripts/reuz-release-signing.sh --self-test

      - name: Prepare permanent release signing key
        if: github.event_name != 'pull_request'
        env:
          # The existing secret now protects the encrypted new key. Its old
          # value does not have to unlock the old PKCS12 keystore.
          REUZ_SIGNING_ENCRYPTION_SECRET: ${{ secrets.REUZ_KEYSTORE_PASSWORD }}
        run: bash scripts/reuz-release-signing.sh

      - name: Build release APK and Play Store bundle
        working-directory: android
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Reuz-Android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: Reuz-PlayStore-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish stable download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Reuz.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Reuz.aab
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Reuz.apk Reuz.aab --target "$GITHUB_SHA" --title "Reuz (latest)" \
            --notes "Latest Reuz build from main. Reuz.apk installs on a phone; Reuz.aab is the Google Play upload bundle." --latest

      - name: Remove temporary decrypted signing key
        if: always()
        shell: bash
        run: |
          if [[ -n "${REUZ_KEYSTORE:-}" && -f "$REUZ_KEYSTORE" ]]; then
            shred -u "$REUZ_KEYSTORE" 2>/dev/null || rm -f "$REUZ_KEYSTORE"
          fi
